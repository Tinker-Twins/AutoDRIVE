slam_toolbox:
  ros__parameters:
    # ===== Ceres Solver (Robust & Precise) =====
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY   # Best accuracy for small-to-medium maps
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: CauchyLoss               # Robust to outliers (e.g., moving objects)

    # ===== Frames & Topics =====
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    map_name: /map
    scan_topic: /scan
    use_map_saver: true
    mode: mapping                                 # Set to "localization" for production

    # ===== Core Timing & Resolution =====
    debug_logging: false
    throttle_scans: 1                             # Process every scan (30 Hz is fine for Ceres at low speed)
    transform_publish_period: 0.02                # 50 Hz TF broadcast – matches your 200 Hz odometry rhythm
    map_update_interval: 1.5                      # Refresh global map every 1.5 s (smooth but not CPU-hungry)
    resolution: 0.025                             # 2.5 cm grid – ultra‑sharp walls, fully justified by slow speed
    restamp_tf: false
    min_laser_range: 0.15                         # Filter out robot chassis reflections (adjust to your lidar's blind zone)
    max_laser_range: 25.0                         # Use the full 25 m range
    minimum_time_interval: 0.2                    # Minimum 0.2 s between processed scans
    transform_timeout: 0.1                        # 100 ms timeout – discard stale transforms quickly
    tf_buffer_duration: 20.0                      # Keep 20 s of TF history for loop closures
    stack_size_to_use: 40000000                   # 40 MB stack for large matrix operations
    enable_interactive_mode: true                 # Allow dynamic rerouting via RViz

    # ===== Scan Matching & Keyframe Insertion =====
    use_scan_matching: true
    use_scan_barycenter: true
    # Aggressive insertion because we move slowly and want dense keyframes
    minimum_travel_distance: 0.08                 # Insert keyframe every 8 cm (~1/3 wheelbase)
    minimum_travel_heading: 0.12                  # Insert keyframe every ~7° heading change – tight corners
    scan_buffer_size: 15                          # Keep 15 keyframes for local map matching
    scan_buffer_maximum_scan_distance: 12.0       # Match against scans up to 12 m away

    # ===== Local Loop Closure (Fine Matching) =====
    link_match_minimum_response_fine: 0.1         # Lower threshold – odometry is good, accept slightly noisier links
    link_scan_maximum_distance: 2.0               # Search within 2 m for local loop closure

    # ===== Global Loop Closure =====
    do_loop_closing: true
    loop_search_maximum_distance: 8.0             # Search for loops up to 8 m away (good for 25 m lidar)
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ===== Correlation Search (Tightened for precise odometry) =====
    # Since odometry is very accurate at 1 m/s, we don't need a huge brute‑force window
    correlation_search_space_dimension: 0.4       # ±0.4 m search window – saves CPU while maintaining precision
    correlation_search_space_resolution: 0.01     # 1 cm search step – very fine
    correlation_search_space_smear_deviation: 0.08

    # ===== Loop Closure Search Space =====
    loop_search_space_dimension: 8.0              # ±8 m for global loop detection
    loop_search_space_resolution: 0.05            # 5 cm step
    loop_search_space_smear_deviation: 0.03

    # ===== Penalty Parameters (trust odometry more) =====
    # Lower penalties mean we rely less on the scan matcher to correct large errors,
    # because the odometry is already extremely trustworthy.
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.5

    # ===== Angle Search Parameters =====
    fine_search_angle_offset: 0.00349             # ~0.2° – fine angular resolution
    coarse_search_angle_offset: 0.349             # ~20° – coarse angular range
    coarse_angle_resolution: 0.0349               # ~2° step in coarse search
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.10                     # Slightly lower threshold to make maps clearer
