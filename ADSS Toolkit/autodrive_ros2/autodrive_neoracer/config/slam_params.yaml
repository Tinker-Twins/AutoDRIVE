slam_toolbox:
  ros__parameters:
    ############################################################################
    # CERES SOLVER
    ############################################################################

    solver_plugin: solver_plugins::CeresSolver  # Plugin used to optimize the pose graph
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY # Linear system solver used by Ceres
    ceres_preconditioner: SCHUR_JACOBI          # Preconditioner for the Ceres linear solver
    ceres_trust_strategy: LEVENBERG_MARQUARDT   # Trust-region strategy for nonlinear optimization
    ceres_dogleg_type: TRADITIONAL_DOGLEG       # Dogleg variant, when the dogleg strategy is selected
    ceres_loss_function: CauchyLoss             # Loss function used to reduce the influence of outliers

    ############################################################################
    # FRAMES AND TOPICS
    ############################################################################

    odom_frame: odom           # Odometry frame
    map_frame: map             # Map frame
    base_frame: base_footprint # Robot base frame
    map_name: /map             # Map topic
    scan_topic: /scan          # LIDAR topic
    use_map_saver: true        # Whether to enable the map-saving interface
    mode: mapping              # SLAM operation mode (mapping or localization)

    ############################################################################
    # CORE TIMING AND RESOLUTION
    ############################################################################

    debug_logging: false           # Whether to enable debug messages
    throttle_scans: 1              # Process one out of every N scans in synchronous mode
    transform_publish_period: 0.02 # Interval (seconds) between map-to-odometry TF broadcasts
    map_update_interval: 1.5       # Interval (seconds) between occupancy map updates
    resolution: 0.025              # Occupancy grid cell size (meters)
    restamp_tf: false              # Whether to stamp TF with the current time instead of scan time
    min_laser_range: 0.15          # Minimum LIDAR range (meters) used for mapping
    max_laser_range: 25.0          # Maximum LIDAR range (meters) used for mapping
    minimum_time_interval: 0.2     # Minimum time (seconds) between scans in synchronous mode
    transform_timeout: 0.1         # Maximum wait (seconds) for required transforms
    tf_buffer_duration: 20.0       # Duration (seconds) of stored transform history
    stack_size_to_use: 40000000    # Stack size (bytes) used for serialization operations
    enable_interactive_mode: true  # Whether to retain data for interactive graph editing

    ############################################################################
    # SCAN MATCHING AND KEYFRAME INSERTION
    ############################################################################

    use_scan_matching: true                 # Whether to refine pose estimates by matching LIDAR scans
    use_scan_barycenter: true               # Whether to use scan centroids for matching
    minimum_travel_distance: 0.08           # Minimum translation (meters) before adding a new scan
    minimum_travel_heading: 0.12            # Minimum rotation (radians) before adding a new scan
    scan_buffer_size: 15                    # Number of recent scans retained for matching
    scan_buffer_maximum_scan_distance: 12.0 # Maximum distance (meters) for scans in the local buffer

    ############################################################################
    # LOCAL LOOP CLOSURE
    ############################################################################

    link_match_minimum_response_fine: 0.1 # Minimum fine-match score for accepting a scan link
    link_scan_maximum_distance: 2.0       # Maximum distance (meters) for linking nearby scans

    ############################################################################
    # GLOBAL LOOP CLOSURE
    ############################################################################

    do_loop_closing: true                    # Whether to search for and close loops in the pose graph
    loop_search_maximum_distance: 8.0        # Maximum distance (meters) for loop-closure candidates
    loop_match_minimum_chain_size: 10        # Minimum number of linked scans in a loop candidate
    loop_match_maximum_variance_coarse: 3.0  # Maximum accepted variance of a coarse loop match
    loop_match_minimum_response_coarse: 0.35 # Minimum score for accepting a coarse loop match
    loop_match_minimum_response_fine: 0.45   # Minimum score for accepting a fine loop match

    ############################################################################
    # CORRELATION SEARCH
    ############################################################################

    correlation_search_space_dimension: 0.4        # Width (meters) of the local matching search area
    correlation_search_space_resolution: 0.01      # Grid spacing (meters) for local matching
    correlation_search_space_smear_deviation: 0.08 # Smearing standard deviation (meters) for local matching

    ############################################################################
    # LOOP CLOSURE SEARCH SPACE
    ############################################################################

    loop_search_space_dimension: 8.0        # Width (meters) of the loop-closure matching search area
    loop_search_space_resolution: 0.05      # Grid spacing (meters) for loop-closure matching
    loop_search_space_smear_deviation: 0.03 # Smearing standard deviation (meters) for loop matching

    ############################################################################
    # PENALTY TERMS
    ############################################################################

    distance_variance_penalty: 0.3 # Distance variance used to penalize displacement from odometry
    angle_variance_penalty: 0.5    # Angular variance used to penalize deviation from odometry

    ############################################################################
    # ANGLE SEARCH
    ############################################################################

    fine_search_angle_offset: 0.00349 # Angular extent (radians) of the fine search
    coarse_search_angle_offset: 0.349 # Angular extent (radians) of the coarse search
    coarse_angle_resolution: 0.0349   # Angular step (radians) for the coarse search
    minimum_angle_penalty: 0.9        # Lower bound on the angular match penalty factor
    minimum_distance_penalty: 0.5     # Lower bound on the distance match penalty factor
    use_response_expansion: true      # Whether to expand the search when the initial response is weak
    min_pass_through: 2               # Minimum cell observations required for occupancy classification
    occupancy_threshold: 0.10         # Occupied-hit fraction threshold for marking a cell occupied
